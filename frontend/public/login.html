<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LearnHub - Login</title>

<style>
/* Reset and basics */
* { box-sizing: border-box; }
html,body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; font-family: "Poppins", "Segoe UI", Arial, sans-serif; background: linear-gradient(180deg,#e9f6ff,#f6fbff); }

/* NAVBAR */
.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(0,0,0,0.05);
  position: sticky;
  top: 0;
  z-index: 20;
}

/* Logo left */
.logo {
  font-size: 26px;
  font-weight: 700;
  color: #2f80ed;
  line-height: 1;
}

/* Right nav group */
.nav-links {
  display: flex;
  gap: 18px;
  align-items: center;
}

/* nav links style */
.nav-links a {
  text-decoration: none;
  color: #333;
  font-weight: 600;
  font-size: 15px;
  padding: 8px 10px;
  transition: color .18s, background .18s;
  border-radius: 8px;
}

/* subtle hover */
.nav-links a:hover { color: #2f80ed; background: rgba(47,128,237,0.06); }

/* register styled as pill */
.register-btn {
  background: #9fe6f5;
  color: #2f80ed !important;
  padding: 8px 14px !important;
  border-radius: 10px;
  font-weight: 700;
}

/* MAIN layout: center area */
.page-wrap {
  min-height: calc(100vh - 66px); /* account for navbar */
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
}

/* Login card */
.login-card {
  width: 420px;
  max-width: calc(100% - 40px);
  background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.96));
  border-radius: 16px;
  padding: 28px;
  box-shadow: 0 14px 40px rgba(20,40,80,0.08);
  text-align: center;
  animation: pop .35s ease;
}

/* small animation */
@keyframes pop {
  from { transform: translateY(8px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

.login-card h2 {
  color: #2f80ed;
  margin: 0 0 18px;
  font-size: 24px;
}

/* form elements layout: full width centered */
form#loginForm { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }

/* inputs: full width and centered inside card */
input[type="email"],
input[type="password"] {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid #d7e4ef;
  font-size: 15px;
  outline: none;
  background: #fff;
  transition: box-shadow .18s, border-color .18s;
}

/* focus styling */
input:focus {
  border-color: #2f80ed;
  box-shadow: 0 6px 18px rgba(47,128,237,0.12);
}

/* login button */
.button {
  margin-top: 6px;
  background: linear-gradient(180deg,#2f80ed,#1b63d6);
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .08s ease, box-shadow .12s ease;
}

.button:active { transform: translateY(1px); }
.button:hover { box-shadow: 0 8px 24px rgba(43,118,255,0.12); }

/* message area */
#errorMsg { color: #d64545; font-size: 14px; min-height: 20px; margin-top: 8px; }

/* small screen tweaks */
@media (max-width: 460px) {
  .login-card { padding: 20px; width: 100%; }
  .logo { font-size: 22px; }
  .nav-links a { font-size: 14px; padding: 6px 8px; }
}
</style>

<!-- page script (your existing auth.js will still run) -->
<script src="../js/auth.js" defer></script>
</head>
<body>

<header class="navbar">
  <div class="logo">LearnHub</div>

  <nav class="nav-links" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="register.html" class="register-btn">Register</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="page-wrap">
  <div class="login-card" role="region" aria-labelledby="loginTitle">
    <h2 id="loginTitle">Login</h2>

    <form id="loginForm" autocomplete="on" novalidate>
      <input type="email" id="email" name="email" placeholder="Email" required />
      <input type="password" id="password" name="password" placeholder="Password" required />
      <button type="submit" class="button">Login</button>
    </form>

    <div id="errorMsg" aria-live="polite"></div>
  </div>
</div>

<script>
/* Small client-side helper so the centered form behavior is visible immediately.
   Your existing ../js/auth.js will run too — this only provides inline fallback display.
*/
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const pwd = document.getElementById('password').value.trim();
  const err = document.getElementById('errorMsg');
  err.textContent = '';

  if (!email || !pwd) { err.textContent = 'Please enter email and password.'; return; }

  // If you want to actually POST to your backend, auth.js handles that normally.
  // Here we show a small "loading" placeholder while auth.js may also run:
  err.style.color = '#2f80ed';
  err.textContent = 'Attempting to login...';
  // let auth.js handle the rest; if you prefer to call API here, replace with fetch.
});
</script>

</body>
</html>

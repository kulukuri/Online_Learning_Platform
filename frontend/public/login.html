<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LearnHub - Login</title>

<style>
/* ---------------------------------------------------
   RESET + GLOBAL
--------------------------------------------------- */
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #e9f6ff, #f6fbff);
}

/* ---------------------------------------------------
   NAVBAR (UNIFORM ACROSS ALL PAGES)
--------------------------------------------------- */
.navbar {
  width: 100%;
  padding: 14px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;

  background: #ffffffd8;
  backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 100;
  box-sizing: border-box;
  border-bottom: 1px solid #e3e3e3;
}

.logo {
  font-size: 26px;
  font-weight: 700;
  color: #2f80ed;
}

/* RIGHT NAV LINKS */
.nav-links,
.navbar nav {
  display: flex;
  align-items: center;
  gap: 20px;
}

.navbar nav a,
.nav-links a {
  text-decoration: none;
  color: #333;
  font-weight: 600;
  font-size: 16px;
  padding: 8px 12px;
  border-radius: 8px;
  transition: 0.25s;
}

.navbar nav a:hover {
  background: rgba(47, 128, 237, 0.10);
  color: #2f80ed;
}

/* Register pill */
.register-btn {
  background: #9fe6f5;
  color: #2f80ed !important;
  padding: 8px 16px !important;
  border-radius: 10px;
  font-weight: 700;
}

/* ---------------------------------------------------
   FORM + CARD STYLING
--------------------------------------------------- */
.page-wrap {
  min-height: calc(100vh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}

/* Login/Register card */
.login-card {
  width: 420px;
  max-width: calc(100% - 40px);
  background: rgba(255, 255, 255, 0.94);
  border-radius: 20px;
  padding: 34px;
  box-shadow: 0 14px 40px rgba(20,40,80,0.10);
  text-align: center;
  animation: fadePop .35s ease-out;
}

/* Card animation */
@keyframes fadePop {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.login-card h2 {
  margin: 0 0 22px;
  color: #2f80ed;
  font-size: 28px;
  font-weight: 700;
}

/* Inputs */
#loginForm,
#registerForm {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

input[type="email"],
input[type="password"],
input[type="text"] {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  border: 1px solid #d7e4ef;
  outline: none;
  background: white;
  transition: 0.25s;
}

input:focus {
  border-color: #2f80ed;
  box-shadow: 0 0 10px rgba(47,128,237,0.15);
}

/* Buttons */
.button {
  border: none;
  padding: 14px;
  border-radius: 10px;
  color: white;
  background: linear-gradient(180deg, #2f80ed, #1b63d6);
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.25s;
}

.button:hover {
  box-shadow: 0 10px 22px rgba(47,128,237,0.18);
}

.button:active {
  transform: translateY(1px);
}

/* Error message */
#errorMsg {
  color: #d64545;
  font-size: 14px;
  min-height: 22px;
}

/* ---------------------------------------------------
   RESPONSIVE
--------------------------------------------------- */
@media (max-width: 460px) {
  .logo { font-size: 28px; }
  .navbar nav a { font-size: 14px; padding: 6px 8px; }
  .login-card { padding: 24px; }
}

</style>

<!-- page script (your existing auth.js will still run) -->
<script src="../js/auth.js" defer></script>
</head>
<body>

<header class="navbar">
  <div class="logo">LearnHub</div>

  <nav class="nav-links" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="register.html" class="register-btn">Register</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<div class="page-wrap">
  <div class="login-card" role="region" aria-labelledby="loginTitle">
    <h2 id="loginTitle">Login</h2>

    <form id="loginForm" autocomplete="on" novalidate>
      <input type="email" id="email" name="email" placeholder="Email" required />
      <input type="password" id="password" name="password" placeholder="Password" required />
      <button type="submit" class="button">Login</button>
    </form>

    <div id="errorMsg" aria-live="polite"></div>
  </div>
</div>

<script>
/* Small client-side helper so the centered form behavior is visible immediately.
   Your existing ../js/auth.js will run too — this only provides inline fallback display.
*/
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const pwd = document.getElementById('password').value.trim();
  const err = document.getElementById('errorMsg');
  err.textContent = '';

  if (!email || !pwd) { err.textContent = 'Please enter email and password.'; return; }

  // If you want to actually POST to your backend, auth.js handles that normally.
  // Here we show a small "loading" placeholder while auth.js may also run:
  err.style.color = '#2f80ed';
  err.textContent = 'Attempting to login...';
  // let auth.js handle the rest; if you prefer to call API here, replace with fetch.
});
</script>

</body>
</html>
